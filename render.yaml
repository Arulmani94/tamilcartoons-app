services:
  - type: web
    name: tamilcartoons-stream
    runtime: docker
    plan: free
    rootDir: telegram-backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: TG_API_ID
        sync: false
      - key: TG_API_HASH
        sync: false
      - key: TG_SESSION_STRING
        sync: false
      - key: TG_ALLOWED_CHANNELS
        sync: false
      - key: FRONTEND_ORIGINS
        value: https://arulmani94.github.io
